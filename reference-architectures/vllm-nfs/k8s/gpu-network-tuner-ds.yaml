# DaemonSet that optimizes NFS throughput on GPU nodes by enabling jumbo frames
# (9000-byte MTU) and increasing TCP buffer sizes. After tuning, labels the node
# with node.digitalocean.com/network-tuned=true so workload pods with a matching
# nodeSelector can schedule. See the "GPU Network Tuner" section in the README.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-network-tuner
  namespace: kube-system
  labels:
    app: gpu-network-tuner
spec:
  selector:
    matchLabels:
      app: gpu-network-tuner
  template:
    metadata:
      labels:
        app: gpu-network-tuner
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/gpu-brand
                operator: In
                values:
                - amd
                - nvidia
      tolerations:
      - key: amd.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      hostNetwork: true
      hostPID: true
      serviceAccountName: gpu-network-tuner
      volumes:
      - name: host-kubectl
        hostPath:
          path: /usr/bin/kubectl
          type: File
      initContainers:
      - name: network-tuner
        image: busybox:stable
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Applying sysctl tuning ==="
          sysctl -w net.core.rmem_max=16777216
          sysctl -w net.core.wmem_max=16777216
          sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"

          echo "=== Persisting sysctl settings ==="
          cat <<'SYSCTL' | nsenter -t 1 -m -- tee /etc/sysctl.d/99-gpu-network-tuning.conf > /dev/null
          net.core.rmem_max=16777216
          net.core.wmem_max=16777216
          net.ipv4.tcp_rmem=4096 87380 16777216
          net.ipv4.tcp_wmem=4096 65536 16777216
          SYSCTL

          echo "=== Persisting MTU 9000 for eth1 via netplan ==="
          cat <<'NETPLAN' | nsenter -t 1 -m -- tee /etc/netplan/60-gpu-network-tuning.yaml > /dev/null
          network:
            version: 2
            ethernets:
              ens4:
                mtu: 9000
          NETPLAN
          nsenter -t 1 -m -- chmod 600 /etc/netplan/60-gpu-network-tuning.yaml

          echo "=== Applying netplan ==="
          nsenter -t 1 -m -- netplan apply

          echo "=== Verifying settings ==="
          sysctl net.core.rmem_max net.core.wmem_max net.ipv4.tcp_rmem net.ipv4.tcp_wmem
          ip link show eth1 | grep mtu
          echo "=== Network tuning complete ==="
        securityContext:
          privileged: true
      - name: label-node
        image: busybox:stable
        command: ["/bin/sh", "-c"]
        args: ["/host-bin/kubectl label nodes $(NODE_NAME) node.digitalocean.com/network-tuned=true --overwrite"]
        volumeMounts:
        - name: host-kubectl
          mountPath: /host-bin/kubectl
          readOnly: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      containers:
      - name: pause
        image: busybox:stable
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
          limits:
            cpu: 10m
            memory: 10Mi
