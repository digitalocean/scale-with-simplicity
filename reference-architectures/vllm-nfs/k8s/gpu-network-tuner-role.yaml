# ClusterRole granting get/patch access to node objects.
# Required so the gpu-network-tuner can remove the network-not-tuned taint after tuning.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-network-tuner
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
